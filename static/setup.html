<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Krill Setup</title>
    <link rel="stylesheet" href="/static/css/style.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="card">
        <h1>Krill Setup</h1>
        <p class="subtitle">Finish setup to enter your gateway.</p>

        <form id="setup-form" novalidate>
          <h2>Bootstrap State</h2>
          <p class="subtitle">Start fresh or import an existing braindump file.</p>

          <div class="actions">
            <button type="button" id="start-scratch-btn" class="secondary">Start from Scratch</button>
          </div>

          <label for="braindump_file">Import braindump.json</label>
          <input id="braindump_file" type="file" accept="application/json,.json" />
          <div id="braindump_dropzone" class="dropzone">Drag and drop braindump.json here</div>
          <button type="button" id="import-braindump-btn">Import Braindump</button>

          <h2>Base Settings</h2>

          <label for="bot_name">Bot Name</label>
          <input id="bot_name" type="text" maxlength="15" required />

          <label for="system_prompt">System Prompt</label>
          <textarea id="system_prompt" maxlength="100" rows="3" required></textarea>

          <h2>Provider Configuration</h2>

          <label for="provider_select">Provider</label>
          <select id="provider_select"></select>

          <label for="model_select">Model</label>
          <select id="model_select"></select>

          <label for="provider_api_key">API Key</label>
          <input id="provider_api_key" type="text" />

          <button type="button" id="add-provider-btn">Add / Update Provider &amp; Model</button>

          <div>
            <h2>Configured Providers</h2>
            <div id="provider-list" class="provider-list"></div>
          </div>

          <label for="active_provider_select">Active Provider</label>
          <select id="active_provider_select"></select>

          <div class="actions">
            <button type="submit" id="complete-btn">Complete Setup</button>
            <a class="button-link secondary hidden" id="gateway-link" href="/gateway">Go to Gateway</a>
          </div>

          <p id="status" role="status" aria-live="polite"></p>
        </form>
      </section>
    </main>

    <script src="/static/js/setup.js"></script>
  </body>
</html>
