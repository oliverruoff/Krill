<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Krill Gateway</title>
    <link rel="stylesheet" href="/static/css/style.css" />
  </head>
  <body>
    <main class="gateway-shell">
      <header class="gateway-topbar">
        <img src="/krill_banner.png" alt="Krill" class="gateway-banner" />
        <div class="menu-wrap">
          <button type="button" id="menu-btn" class="icon-btn" aria-expanded="false" aria-controls="menu-popover" aria-label="Open menu">&#9881;</button>
          <div id="menu-popover" class="menu-popover hidden" role="menu">
            <a href="/api/braindump/download" class="menu-item" download="braindump.json" role="menuitem">Braindump</a>
            <a href="/setup" class="menu-item" role="menuitem">Settings</a>
          </div>
        </div>
      </header>

      <section class="chat-panel">
        <div class="chat-meta">
          <div class="provider-meta">
            <p class="meta-row"><strong>Provider</strong> <span id="provider-indicator">Loading...</span></p>
            <p class="meta-row"><strong>Model</strong> <span id="model-indicator">Loading...</span></p>
          </div>
          <p id="token-counter" class="token-counter">0 / 0 tokens (0.00% used)</p>
        </div>

        <div id="chat-thread" class="chat-thread" aria-live="polite"></div>

        <form id="chat-form" class="chat-composer" novalidate>
          <label for="chat-input">Message</label>
          <textarea id="chat-input" rows="3" maxlength="5000" required></textarea>
          <div class="actions">
            <button type="submit" id="send-btn">Send</button>
          </div>
        </form>

        <p id="status" role="status" aria-live="polite"></p>
      </section>
    </main>

    <script src="/static/js/gateway.js"></script>
  </body>
</html>
