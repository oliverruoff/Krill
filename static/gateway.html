<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Krill Gateway</title>
    <link rel="stylesheet" href="/static/css/style.css" />
  </head>
  <body>
    <main class="gateway-shell">
      <header class="gateway-topbar">
        <img src="/krill_banner.png" alt="Krill" class="gateway-banner" />
        <a href="/setup" class="button-link secondary">Settings</a>
      </header>

      <section class="chat-panel">
        <p id="model-indicator" class="subtitle">Loading active provider...</p>

        <div id="chat-thread" class="chat-thread" aria-live="polite"></div>

        <form id="chat-form" class="chat-composer" novalidate>
          <label for="chat-input">Message</label>
          <textarea id="chat-input" rows="3" maxlength="5000" required></textarea>
          <div class="actions">
            <button type="submit" id="send-btn">Send</button>
          </div>
        </form>

        <p id="status" role="status" aria-live="polite"></p>
      </section>
    </main>

    <script src="/static/js/gateway.js"></script>
  </body>
</html>
