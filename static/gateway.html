<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Krill Gateway</title>
    <link rel="icon" type="image/png" href="/static/img/krill_icon.png" />
    <link rel="stylesheet" href="/static/css/style.css" />
  </head>
  <body>
    <main class="gateway-shell">
      <header class="gateway-topbar">
        <img src="/static/img/krill_banner.png" alt="Krill" class="gateway-banner" />
        <div class="assistant-header">
          <p id="assistant-title" class="assistant-title">This is your personal assistant.</p>
          <p id="assistant-meta" class="assistant-meta">Loading assistant metadata...</p>
        </div>
        <div class="gateway-switchers">
          <label class="switch-field" for="header-provider-select">
            <span>Provider</span>
            <select id="header-provider-select"></select>
          </label>
          <label class="switch-field" for="header-model-select">
            <span>Model</span>
            <select id="header-model-select"></select>
          </label>
        </div>
        <div class="menu-wrap">
          <button type="button" id="menu-btn" class="icon-btn" aria-expanded="false" aria-controls="menu-popover" aria-label="Open menu">&#9881;</button>
          <div id="menu-popover" class="menu-popover hidden" role="menu">
            <a href="/api/braindump/download" class="menu-item" download="braindump.json" role="menuitem">Braindump</a>
            <a href="/setup" class="menu-item" role="menuitem">Settings</a>
          </div>
        </div>
      </header>

      <div class="gateway-body">
        <aside class="chat-history-panel">
          <div class="chat-history-header">
            <h2>Chats</h2>
            <button type="button" id="new-chat-btn" class="new-chat-btn">New chat</button>
          </div>
          <div id="chat-history-list" class="chat-history-list" aria-label="Chat history"></div>

          <section class="mcp-panel" aria-label="MCP tools">
            <div class="mcp-header">
              <h3>MCPs</h3>
            </div>
            <div id="mcp-list" class="mcp-list"></div>
          </section>
        </aside>

        <section class="chat-panel">
          <div class="chat-meta">
            <div class="provider-meta">
              <p class="meta-row"><strong>Provider</strong> <span id="provider-indicator">Loading...</span></p>
              <p class="meta-row"><strong>Model</strong> <span id="model-indicator">Loading...</span></p>
              <button type="button" id="system-trace-toggle" class="trace-toggle-btn">Hide system trace</button>
            </div>
            <p id="current-chat-title" class="current-chat-title">New chat</p>
            <div class="token-tools">
              <p id="token-counter" class="token-counter">0 / 0 tokens (0.00% used)</p>
              <p id="token-counter-total" class="token-counter token-counter-total">Chat total: 0</p>
              <button type="button" id="compact-btn" class="compact-btn">Compaction</button>
            </div>
          </div>

          <div id="chat-thread" class="chat-thread" aria-live="polite"></div>

          <form id="chat-form" class="chat-composer" novalidate>
            <label for="chat-input">Message</label>
            <textarea id="chat-input" rows="3" maxlength="5000" required></textarea>
            <div class="actions">
              <button type="submit" id="send-btn">Send</button>
            </div>
          </form>

          <p id="status" role="status" aria-live="polite"></p>
        </section>
      </div>
    </main>

    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

    <script src="/static/js/gateway.js"></script>
  </body>
</html>
